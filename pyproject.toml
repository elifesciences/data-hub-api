[project]
name = "data-hub-api"
version = "0.0.0"
description = "Data Hup DocMaps API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.29.0",
    "markdown>=3.9",
    "mdx-linkify>=2.1",
    "nh3>=0.3.3",
    "numpy>=2.0.2",
    "objsize>=0.8.0",
    "pandas>=2.3.3",
    "pyarrow>=19.0.0",
    "types-python-dateutil>=2.9.0.20260305",
    "types-requests>=2.32.4.20260107",
    "uvicorn[standard]>=0.45.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "mypy>=1.20.1",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watch>=4.2.0",
    "types-markdown>=3.10.0.20251106",
]
