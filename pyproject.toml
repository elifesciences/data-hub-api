[project]
name = "data-hub-api"
version = "0.0.0"
description = "Data Hup DocMaps API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.38.0",
    "markdown>=3.9",
    "mdx-linkify>=2.1",
    "nh3>=0.3.5",
    "numpy>=2.4.5",
    "objsize>=0.8.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "types-python-dateutil>=2.9.0.20260518",
    "types-requests>=2.33.0.20260518",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watch>=4.2.0",
    "types-markdown>=3.10.2.20260518",
]
